{% comment %} The glyph sprite: one <symbol> per name in mutint_recurrent.glyphs.GLYPHS, each in a
   16x16 box, drawn once and referenced by <use> from every table cell, legend entry and plot
   flag. The shade is a class on the referencing <svg>, so the paths carry no fill or stroke
   of their own: recurrent.css paints them. The tombstone is a half-circle on a rectangle, the
   bowtie two triangles meeting at a point, the barbell two triangles pointing outward from a bar. {% endcomment %}
